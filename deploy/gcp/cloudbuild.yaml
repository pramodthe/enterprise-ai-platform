# Cloud Build: build and push API + UI images to Artifact Registry.
# Deploy with `gcloud run deploy` (see deploy/gcp/README.md) so you can set secrets and CORS in the right order.
#
# Prereqs (once per project / region):
#   gcloud services enable artifactregistry.googleapis.com cloudbuild.googleapis.com
#   gcloud artifacts repositories create enterprise-ai --repository-format=docker --location=REGION
#
# Submit:
#   gcloud builds submit --config deploy/gcp/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_AR_REPO=enterprise-ai,_VITE_API_BASE=https://YOUR-API-xxxxx.run.app \
#     .
#
# _VITE_API_BASE: public origin of the API (no /api suffix). Required for the UI image so the browser can call the API from another host.

substitutions:
  _REGION: us-central1
  _AR_REPO: enterprise-ai
  _VITE_API_BASE: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:latest
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api

  - id: build-ui
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - new_frontend/Dockerfile
      - --build-arg
      - VITE_API_BASE=${_VITE_API_BASE}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ui:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ui:latest
      - .

  - id: push-ui
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ui

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ui:$SHORT_SHA
