# Build and push the UI image only. Set _VITE_API_BASE to your API Cloud Run URL (no trailing slash).

substitutions:
  _REGION: us-central1
  _AR_REPO: enterprise-ai
  _VITE_API_BASE: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - new_frontend/Dockerfile
      - --build-arg
      - VITE_API_BASE=${_VITE_API_BASE}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ui:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ui:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ui

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ui:$SHORT_SHA
